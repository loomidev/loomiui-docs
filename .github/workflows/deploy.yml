name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout docs
        uses: actions/checkout@v7
        with:
          path: docs

      # Component docs and previews are generated from this repo's package READMEs
      # and compiled dist/ output — see docs/scripts/gen-component-docs.mjs.
      # loomiui is public, so the default GITHUB_TOKEN can read it.
      - name: Checkout components
        uses: actions/checkout@v7
        with:
          repository: loomidev/loomiui
          path: components

      # LoomiUI Pro is private and the default GITHUB_TOKEN is scoped to this
      # repo alone, so it 404s there. Mint a short-lived installation token from
      # the "LoomiUI Docs Deploy" GitHub App instead of a PAT — nothing to rotate
      # on an expiry. The App needs Contents: read-only on loomiui-pro; note that
      # the App must be *installed* on a repo, which its being public would not
      # substitute for.
      - name: Mint Pro repo token
        id: pro-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.LOOMI_PRO_APP_ID }}
          private-key: ${{ secrets.LOOMI_PRO_APP_PRIVATE_KEY }}
          owner: loomidev
          repositories: loomiui-pro

      - name: Checkout Pro
        uses: actions/checkout@v7
        with:
          repository: loomidev/loomiui-pro
          token: ${{ steps.pro-token.outputs.token }}
          path: pro

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Astro 6 requires >=22.12; anything older fails at `astro check`,
          # after the components and Pro previews have already built.
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            docs/pnpm-lock.yaml
            components/pnpm-lock.yaml
            pro/pnpm-lock.yaml

      - name: Install components dependencies
        run: pnpm install --frozen-lockfile
        working-directory: components

      - name: Build component packages
        run: pnpm build
        working-directory: components

      - name: Install Pro dependencies
        run: pnpm install --frozen-lockfile
        working-directory: pro

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile
        working-directory: docs

      # The prebuild hook compiles all Pro preview dependencies and the four
      # real Lit applications, copies them into public/pro/live/, prepares the
      # remaining generated content, then runs `astro check && astro build`.
      # PUBLIC_* values are inlined into the static output at build time, so they
      # have to be present here rather than on the droplet. Without the portal
      # origin the licensing CTAs would fall back to localhost, so the build
      # fails outright instead — see docs/src/lib/pro-licensing.mjs.
      - name: Build docs site
        run: |
          if [ -z "$PUBLIC_LOOMI_PORTAL_URL" ]; then
            echo "PUBLIC_LOOMI_PORTAL_URL is not configured as a production environment variable or secret." >&2
            exit 1
          fi
          pnpm build
        working-directory: docs
        env:
          PUBLIC_LOOMI_PORTAL_URL: ${{ vars.PUBLIC_LOOMI_PORTAL_URL || secrets.PUBLIC_LOOMI_PORTAL_URL }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DROPLET_PORT || 22 }}" -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      # Releases land in <deploy-path>.releases/<sha>/ and DROPLET_DEPLOY_PATH is
      # a symlink pointing at the live one — that's what nginx's `root` resolves.
      # Rsyncing straight into the web root would leave the site half-copied for
      # the length of the transfer and destroy the previous build, so there'd be
      # nothing to roll back to if a build came out broken.
      - name: Deploy to droplet
        run: |
          set -euo pipefail

          # Strip any trailing slash: with one, ".releases" and ".new" would be
          # built *inside* the web root ("…/loomiui.com/.releases") and the flip
          # would try to mv a symlink over a directory.
          DEPLOY_PATH="${{ secrets.DROPLET_DEPLOY_PATH }}"
          DEPLOY_PATH="${DEPLOY_PATH%/}"
          RELEASES="${DEPLOY_PATH}.releases"
          RELEASE="${RELEASES}/${GITHUB_SHA}"
          REMOTE="${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}"
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${{ secrets.DROPLET_PORT || 22 }}"

          $SSH_CMD "$REMOTE" "mkdir -p '$RELEASES' ~/bin"

          # Ship the rollback tool with every deploy so it can never drift from
          # the release layout above. Ubuntu's default ~/.profile puts ~/bin on
          # PATH, so `loomiui-rollback` just works — and needs no sudo.
          rsync -az --chmod=F755 -e "$SSH_CMD" \
            docs/deploy/rollback.sh "$REMOTE:bin/loomiui-rollback"

          # --link-dest hardlinks everything unchanged since the live release, so
          # a deploy ships only what actually differs and a kept release costs
          # roughly nothing on disk. It warns and copies in full on first run,
          # when the symlink doesn't exist yet.
          rsync -avz --delete --link-dest="$DEPLOY_PATH" \
            -e "$SSH_CMD" \
            docs/dist/ \
            "$REMOTE:$RELEASE/"

          # ln into a scratch name then mv -T over the symlink: the swap is a
          # single rename(2), so no request ever sees a partial site. Keep the
          # five most recent releases so a rollback is one symlink away — minus
          # whichever one is live, which after a rollback is NOT among the five
          # newest and would otherwise be deleted out from under nginx.
          $SSH_CMD "$REMOTE" "
            set -eu
            # A real directory here means the droplet still predates the release
            # layout; mv would fail with a bare 'cannot overwrite directory'.
            if [ -d '$DEPLOY_PATH' ] && [ ! -L '$DEPLOY_PATH' ]; then
              # The path is a masked secret in the log, so report its type too —
              # that part isn't masked and is what actually needs diagnosing.
              echo \"deploy path type: \$(stat -c '%F' '$DEPLOY_PATH' 2>/dev/null || echo unknown)\" >&2
              echo \"it is a real directory, not a symlink to a release.\" >&2
              echo \"The new release is already uploaded at '$RELEASE'.\" >&2
              echo \"Replace the directory with a symlink to it to go live.\" >&2
              exit 1
            fi
            ln -sfn '$RELEASE' '${DEPLOY_PATH}.new'
            mv -T '${DEPLOY_PATH}.new' '$DEPLOY_PATH'
            live=\$(readlink '$DEPLOY_PATH')
            ls -1dt '$RELEASES'/*/ | sed 's:/*\$::' | tail -n +6 \
              | grep -vFx \"\$live\" | xargs -r rm -rf
          "

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
