# nginx config for archived docs versions. deploy.yml archives each superseded
# version line beside the live site, e.g. /var/www/html/v0.loomiui.com next to
# /var/www/html/loomiui.com, and the version switcher links to it at
# https://v0.loomiui.com. Nothing here is installed by the deploy; set it up once
# on the droplet.
#
# 1. DNS (Namecheap → Domain List → Manage → Advanced DNS): add an A record with
#    Host `*` and the droplet's IP (and an AAAA record if the droplet has IPv6).
#
# 2. TLS: a wildcard certificate for *.loomiui.com. Let's Encrypt only issues
#    wildcards over the DNS-01 challenge, which means creating a TXT record through
#    the DNS provider's API. certbot has no Namecheap plugin, so this uses acme.sh,
#    which does. acme.sh runs as your normal (non-root) user; the setup below gives
#    that user just the two permissions it needs.
#
#    Before starting:
#      - Namecheap → Profile → Tools → API Access: whitelist the droplet's public
#        IP, and copy the API key.
#      - loomiui.com must use Namecheap BasicDNS (not custom nameservers), or the
#        API can't edit its records.
#      - Note down the domain's current DNS records. Namecheap's API replaces the
#        whole record set on every change; acme.sh reads and rewrites the existing
#        records each time, but a copy makes any mishap easy to undo.
#
#    Install acme.sh (the email is for Let's Encrypt expiry notices):
#
#      curl https://get.acme.sh | sh -s email=you@example.com
#      source ~/.bashrc
#
#    Issue the certificate. The three variables are only needed this once; acme.sh
#    saves them to ~/.acme.sh/account.conf for renewals.
#
#      export NAMECHEAP_USERNAME="<namecheap username>"
#      export NAMECHEAP_API_KEY="<api key>"
#      export NAMECHEAP_SOURCEIP="<droplet public ip>"
#      acme.sh --issue --server letsencrypt --dns dns_namecheap -d '*.loomiui.com'
#
#    Let your user write the certificate folder (nginx starts as root, so it can
#    still read it) and reload nginx without a password, and nothing else, so
#    renewals can reload it. Use `which systemctl` for the path if it differs.
#
#      sudo mkdir -p /etc/nginx/ssl
#      sudo chown "$USER": /etc/nginx/ssl && sudo chmod 750 /etc/nginx/ssl
#      echo "$USER ALL=(root) NOPASSWD: /usr/bin/systemctl reload nginx" \
#        | sudo tee /etc/sudoers.d/acme-nginx-reload
#      sudo chmod 440 /etc/sudoers.d/acme-nginx-reload && sudo visudo -c
#
#    Install it where the server block below expects it, and have every renewal
#    reload nginx:
#
#      acme.sh --install-cert -d '*.loomiui.com' \
#        --key-file /etc/nginx/ssl/loomiui-wildcard.key \
#        --fullchain-file /etc/nginx/ssl/loomiui-wildcard.fullchain.pem \
#        --reloadcmd "sudo systemctl reload nginx"
#
#    acme.sh adds a daily cron job that renews it about every 60 days. Check it
#    with `crontab -l` and `acme.sh --list`.
#
# 3. This file: copy the two server blocks below into
#    /etc/nginx/sites-available/loomiui-archives, symlink it into sites-enabled,
#    then `sudo nginx -t && sudo systemctl reload nginx`.
#
# 4. The live site's existing server block also needs the location block at the
#    bottom of this file, so archived versions can read the live version list.

server {
    listen 80;
    listen [::]:80;
    server_name ~^v[0-9]+\.loomiui\.com$;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` rather than `http2 on;`, which needs nginx 1.25.1+ (newer
    # than Ubuntu 22.04/24.04 ship). Newer nginx only warns about this form.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # Only v0, v1, v2 style hosts match, so $host is always a safe directory name.
    server_name ~^v[0-9]+\.loomiui\.com$;

    ssl_certificate /etc/nginx/ssl/loomiui-wildcard.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/loomiui-wildcard.key;

    root /var/www/html/$host;
    index index.html;

    # Old docs stay reachable but out of search results, so they don't compete
    # with the live docs.
    add_header X-Robots-Tag "noindex" always;

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}

# --- Add to the live loomiui.com server block (not a standalone block) ---
#
#   location = /versions.json {
#       add_header Access-Control-Allow-Origin "*" always;
#   }
#
# nginx drops server-level add_header lines inside a location that has its own, so
# repeat any security headers the loomiui.com block sets there as well.
